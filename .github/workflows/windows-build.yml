name: IGM Manager — Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # Valeur factice : le build n'a pas besoin d'une vraie base de données
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db

jobs:
  build:
    name: Build Next.js (Windows)
    runs-on: windows-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Installation des dépendances
        run: npm install --no-audit --no-fund

      - name: Lint (non bloquant)
        run: npm run lint
        continue-on-error: true

      - name: Vérification des types (non bloquant)
        run: npm run typecheck
        continue-on-error: true

      - name: Build de production
        run: npm run build

      - name: Archive du build
        uses: actions/upload-artifact@v4
        with:
          name: IGMManager-build
          path: |
            .next/
            desktop/
            package.json
          retention-days: 14
